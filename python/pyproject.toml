[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jneuro"
version = "0.1.0.dev0"
description = "Evolutionary neural networks with bit-exact, cross-language reproducibility"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["jneuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
